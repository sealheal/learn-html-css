<!doctype html>
<html lang="ko-KR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>폼 (input) 요소</title>
    <link rel="shortcut icon" href="/favicon/likelion.ico" type="image/x-icon" />
    <link rel="icon" href="/favicon/likelion.svg" type="image/svg+xml" />
    <link rel="preload" as="font" href="/font/suit/SUIT-Variable.woff2" />
    <link rel="stylesheet" href="/font/suit/SUIT-Variable.css" />
    <link rel="stylesheet" href="/src/common/index.css" />
  </head>
  <body style="margin: 50px">
    <div class="go-index"><a href="/index.html">Index로 이동</a></div>
    <h1>폼 (input) 요소</h1>
<!-- form 요소 안에 submit 버튼이 있는 경우 -->
<!-- type 속성의 값을 email로 지정하면 입력 값은 이메일 형식을 유지해야 함. -->
<form action="/" method="post" id="likelion">
<input type="email" name="userEmail" id="userEmail" />
<button type="submit">전송</button>
</form>

<!-- form 요소 밖에 submit 버튼이 있는 경우 (id, form 속성으로 연결) -->
<!-- HTML5에 새롭게 추가된 사용 방식 -->
<!-- type 속성의 값을 url로 지정하면 입력 값은 이메일 형식을 유지해야 함. -->
<form action="/" method="post" id="bootcamp"></form>
<input type="url" form="bootcamp" name="yourEmail" id="yourEmail" />
<button type="submit" form="bootcamp">전송</button>
    </form>
    <hr />
    <!-- fieldset과 legend 요소로 연관성 있는 폼 서식을 그룹화 시킬 경우 -->
    <form action="">
<fieldset>
<legend>고객 정보</legend>
<!-- 명시적인 레이블링 -->
<div>
<label for="userName">성명</label>
<input type="text" name="userName" id="userName" required />
</div>
<input type="text" name="userEmail" id="userEmail" required placeholder="guest@linklion.net" pattern="[A-Za-z0-9!#$%&'*+/=?^_`{|}~@.\-]+" />
<!-- 암묵적인 레이블링 -->
<div>
<label>
암호
<input type="password" name="userPwd" required placeholder="6자리 이하" maxlength="6" />
</label>
</div>
<input type="reset" value="초기화" />
<input type="submit" value="전송" />
</fieldset>
<!-- 다양한 입력 서식 -->
 <!-- 체크 박스 -->
<div>
<input type="checkbox" name="frontend" id="html" value="html" />
<label for="html">HTML</label>
</div>
<div>
<input type="checkbox" name="frontend" id="css" value="css" />
<label for="css">CSS</label>
</div>
<div>
<input type="checkbox" name="frontend" id="js" value="js" />
<label for="js">Javscript</label>
</div>
<!-- 라디오 버튼 -->
<fieldset>
<legend>성별</legend>
<div>
<input checked type="radio" name="gender" id="male" />
<label for="">남성</label>
</div>
<div>
<input type="radio" name="gender" id="female" />
<label for="">여성</label>
</div>
</fieldset>
<!-- 색상 입력 서식 -->
<div>
<label for="forground">글자색</label>
<input type="color" name="forground" id="forground" />
</div>

</form>
  </body>
</html>
